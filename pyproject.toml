[project]
name = "claude-ableton"
version = "0.1.0"
description = "MCP server letting Claude drive Ableton Live 12 via AbletonOSC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Rohail Altaf" }]
dependencies = [
    "python-osc>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_ableton"]
